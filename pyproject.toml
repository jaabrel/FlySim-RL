[project]
name = "algoritmos-de-gestao-de-energia-projeto-final"
version = "0.1.0"
description = "FlySIM-RL: Simulador para Aprendizagem por Reforço Aplicada ao Mapeamento de Focos de Poluição"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "ruff>=0.15.12",
]

[project.scripts]
flysim = "flysim.__main__:main"
flysim-dashboard = "flysim.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build.backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.extra-build-dependencies]
algoritmos-de-gestao-de-energia-projeto-final = ["setuptools"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["flysim"]